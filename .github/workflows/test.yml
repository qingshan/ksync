name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: extractions/setup-just@v2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cargo fmt --check
      - run: just test
      - run: just e2e
